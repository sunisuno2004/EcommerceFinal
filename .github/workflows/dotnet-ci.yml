name: ECommerce CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ECommerce.slnx

      - name: Build all projects
        run: dotnet build ECommerce.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test ECommerce.Tests/ECommerce.Tests.csproj --configuration Release --no-build